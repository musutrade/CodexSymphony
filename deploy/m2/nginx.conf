# Administrator replaces platform.example.invalid and supplies its certificate.
# Run this service separately from the control plane and candidate executors.
worker_processes 1;
pid /run/codexsymphony-ingress/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    server {
        listen 127.0.0.1:8443 ssl default_server;
        server_name platform.example.invalid;
        ssl_certificate /etc/codexsymphony-ingress/fullchain.pem;
        ssl_certificate_key /etc/codexsymphony-ingress/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host != platform.example.invalid) { return 403 '{"error":"untrusted_host"}'; }
        add_header Strict-Transport-Security "max-age=31536000" always;
        root /opt/codexsymphony/web;
        location / { try_files $uri $uri/ /index.html; }
        location /api/ {
            proxy_pass http://127.0.0.1:3081;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header X-Forwarded-Host platform.example.invalid;
            proxy_set_header X-Forwarded-Proto https;
            # No client-supplied forwarding chain or Access identity is trusted.
            # Tunnel mode deliberately rate limits all clients as one source.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header CF-Access-Jwt-Assertion "";
            proxy_set_header CF-Access-Authenticated-User-Email "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Auth-Request-Email "";
            proxy_set_header Connection "";
            proxy_redirect off;
            proxy_read_timeout 30s;
        }
    }
}
