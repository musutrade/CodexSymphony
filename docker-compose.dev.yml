# Independent of docker-compose.yml, whose test database is disposable tmpfs.
name: codexsymphony-persistent-dev
services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    mem_limit: 536870912
    memswap_limit: 1073741824
    cpus: 1.0
    environment:
      POSTGRES_USER: codexsymphony_dev
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Copy .env.example to .env and set the local development password}
      POSTGRES_DB: codexsymphony_dev
    ports:
      - '127.0.0.1:54330:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codexsymphony_dev -d codexsymphony_dev']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
