name: codexsymphony-dev
services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    mem_limit: 2147483648
    memswap_limit: 4294967296
    cpus: 1.0
    environment:
      POSTGRES_USER: codexsymphony_test
      POSTGRES_PASSWORD: codexsymphony_test
      POSTGRES_DB: codexsymphony_test
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codexsymphony_test -d codexsymphony_test']
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
