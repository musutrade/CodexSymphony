name: codexsymphony-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codexsymphony_test
      POSTGRES_PASSWORD: codexsymphony_test
      POSTGRES_DB: codexsymphony_test
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codexsymphony_test -d codexsymphony_test']
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
