version = 2

[project]
name = "codexsymphony"
default_profile = "full"
hook_profile = "hook"

[paths]
reports = ".harness-gate/reports"
audit_config = ".harness-gate/audit.toml"
secrets_config = ".harness-gate/secrets.toml"

[paths.aliases]

[policy]
required_steps = [
    "project.diff-check",
    "project.staged-diff-check",
]
waivers = []

[[doctor.checks]]
id = "tool.git"
label = "git"
required = true
timeout_secs = 15
kind = "command"
program = "git"
args = ["--version"]

[[doctor.checks]]
id = "git.remotes"
label = "Git remotes"
required = true
timeout_secs = 15
kind = "git-remotes"

[services]

[parsers]

[report_templates]

[execution]
parallel = false

[execution.retries]

[execution.shards]

[notifications]
webhooks = []

[scope]
unmatched = "all"

[[scope.rules]]
patterns = ["**"]
components = ["project"]

[[steps]]
id = "project.diff-check"
label = "Git whitespace check"
component = "project"
profiles = ["full"]
program = "git"
args = [
    "diff",
    "--check",
]
cwd = "{root}"
log = "git_diff_check.log"
timeout_secs = 60
services = []
remove_env = []
depends_on = []
input = "repository"

[[steps]]
id = "project.staged-diff-check"
label = "staged Git whitespace check"
component = "project"
profiles = ["hook"]
program = "git"
args = [
    "diff",
    "--cached",
    "--check",
]
cwd = "{root}"
log = "git_staged_diff_check.log"
timeout_secs = 60
services = []
remove_env = []
depends_on = []
input = "repository"
